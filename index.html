<p class="note">This version keeps songs in this browser only. Nothing is uploaded. It's separate from TRCKROOM on your Mac, and your phone may clear this storage, so keep your original files.</p>`;

if($('#hp')){$('#hp').onclick=()=>playSong(lead,all);$('#hr').onclick=()=>{reviewId=lead.id;tab='ar';render()}}$$('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;viewLib()});
$('#newpl').onclick=()=>{const c=$('#newpl');c.outerHTML='<form id="plf" class="plf"><input id="pln" placeholder="Playlist name" aria-label="Playlist name" maxlength="40"><button class="btn">Create</button></form>';$('#pln').focus();$('#plf').onsubmit=e=>{e.preventDefault();const n=$('#pln').value.trim();if(!n)return;const p={id:'pl-'+crypto.randomUUID(),name:n,songs:[]};playlists.push(p);savePl();filter=p.id;viewLib();toast('Playlist created. Add songs from each song’s details.')}};

const NOT=['Artist identity','Delivery and flow','Hook effectiveness','Atmosphere','Originality','Emotional impact','Production chemistry','Replay appeal','Genre authenticity'];
function viewAr(){const v=$('#view'),real=songs.filter(s=>!s.example),list=real.length?real:songs,s=songs.find(x=>x.id===reviewId)||list[0];if(!s){v.innerHTML='<h1>A&amp;R</h1><p class="empty">Add a song in Library to get a review.</p>';return}const V=ver(s),m=V.m,r=report(m);
v.innerHTML=`<h1>A&amp;R</h1>${list.length>1?`<div class="chips scroll">${list.map(x=>`<button class="chip" aria-pressed="${x===s}" data-r="${x.id}">${esc(x.title.slice(0,22))}</button>`).join('')}</div>`:''}${s.versions.length>1?`<div class="chips">${s.versions.map(x=>`<button class="chip" data-rv="${x.id}" aria-pressed="${x===V}">${esc(x.name)}</button>`).join('')}</div>`:''}
<section class="hero" style="min-height:190px"><img src="${cover(coverFor(s))}" alt=""><p class="dim" style="margin:0">${esc(s.title)}, ${esc(V.name)}</p><h1 style="font-size:30px">${esc(r.verdict)}</h1></section>
<div class="glance"><div class="g"><small>Measured issues</small><b class="num">${r.issues}</b></div><div class="g"><small>Creative scores</small><b class="num">0</b> <small style="display:inline">of ${NOT.length}</small></div><div class="g"><small>Average level</small><b class="num" style="font-size:22px">${m.avg.toFixed(1)} dB</b></div><div class="g"><small>Peak</small><b class="num" style="font-size:22px">${m.peakDb.toFixed(1)} dB</b></div></div>
${m.secs.length>1?`<h2>Song map</h2><div class="map" role="group" aria-label="Sections of the song">${m.secs.map((x,i)=>`<button class="c${i%4}" style="flex-grow:${x.end-x.start};height:${Math.max(34,Math.min(100,62+(x.level-m.mean)*5))}%" data-j="${x.start}" aria-label="Play from ${fmt(x.start)}">${fmt(x.start)}</button>`).join('')}</div>${r.moments.map(x=>`<div class="find"><button class="stamp" data-j="${x.t}">${fmt(x.t)}</button><p>${x.x}</p></div>`).join('')}`:''}
<h2>Findings</h2>${r.items.length?r.items.map(i=>`<div class="find">${i.t!=null?`<button class="stamp" data-j="${i.t}">${fmt(i.t)}</button>`:'<span></span>'}<div><span class="sev ${i.sev}">${i.l}</span><p>${i.x}</p></div></div>`).join(''):'<p class="dim">Nothing measured needs attention.</p>'}
<h2>Creative scores</h2><p class="dim small">Nothing here can hear your vocals, flow or hooks, so these stay unscored until a listening model is connected and checked by real reviewers.</p>${NOT.map(n=>`<div class="na"><span>${n}</span><span class="meter"></span><span>Not assessed</span></div>`).join('')}`;

const ACC=[['lavender','Lavender','#A497C7'],['sage','Sage','#8FB0A5'],['amber','Amber','#C9A96E'],['rose','Dusk rose','#C79AA0'],['smoke','Smoke','#BDBBB4']],HEAD=[['Archivo','Archivo:wdth,wght@125,800','"Archivo"'],['Anton','Anton','"Anton"'],['Bebas Neue','Bebas+Neue','"Bebas Neue"'],['Syne','Syne:wght@800','"Syne"'],['Unbounded','Unbounded:wght@800','"Unbounded"'],['Abril Fatface','Abril+Fatface','"Abril Fatface"'],['Space Mono','Space+Mono:wght@700','"Space Mono"'],['Permanent Marker','Permanent+Marker','"Permanent Marker"']],TEXT=[['Instrument Sans','Instrument+Sans:wght@400;500;600','"Instrument Sans"'],['DM Sans','DM+Sans:wght@400;600','"DM Sans"'],['Space Grotesk','Space+Grotesk:wght@400;600','"Space Grotesk"'],['IBM Plex Mono','IBM+Plex+Mono:wght@400;600','"IBM Plex Mono"'],['Lora','Lora:wght@400;600','"Lora"']];
function loadFont(q){if(document.querySelector(`link[data-f="${q}"]`))return;const l=document.createElement('link');l.rel='stylesheet';l.dataset.f=q;l.href='https://fonts.googleapis.com/css2?family='+q+'&display=swap';document.head.appendChild(l)}
function applyPrefs(){const st=document.documentElement.style,h=HEAD.find(x=>x[0]===LS.get('head','Archivo'))||HEAD[0],t=TEXT.find(x=>x[0]===LS.get('text','Instrument Sans'))||TEXT[0];loadFont(h[1]);loadFont(t[1]);st.setProperty('--head-font',h[2]+',-apple-system,system-ui,sans-serif');st.setProperty('--text-font',t[2]+',-apple-system,system-ui,sans-serif');if(LS.get('follow','1')!=='1'){st.setProperty('--accent',(ACC.find(a=>a[0]===LS.get('accent','lavender'))||ACC[0])[2]);}}
function viewSet(){const v=$('#view'),chips=(k,opts,cur)=>opts.map(o=>`<button class="chip" data-k="${k}" data-v="${o[0]}" aria-pressed="${cur===o[0]}" style="${k==='head'||k==='text'?`font-family:${o[2].replace(/"/g,"'")}`:''}">${o[k==='accent'?1:0]}</button>`).join('');const fl=LS.get('follow','1')==='1';v.innerHTML=`<h1>Settings</h1><h2>Color</h2><div class="chips"><button class="chip" id="fl" aria-pressed="${fl}">Match the song's cover</button>${chips('accent',ACC,fl?'':LS.get('accent','lavender'))}</div><h2>Headline font</h2><div class="chips">${chips('head',HEAD,LS.get('head','Archivo'))}</div><h2>Text font</h2><div class="chips">${chips('text',TEXT,LS.get('text','Instrument Sans'))}</div><h2>Playback</h2><div class="chips"><button class="chip" id="mt" aria-pressed="${LS.get('match','1')==='1'}">Match loudness between versions</button></div><h2>What this version does</h2><p class="dim">Plays songs with versions, lyrics, playlists and favorites, measures level, clipping, stereo and song shape,. Everything stays on this phone. Accounts and your Mac's library aren't here.</p>`;$('#fl').onclick=()=>{const n=LS.get('follow','1')==='1'?'0':'1';LS.set('follow',n);if(n==='1'&&cur)glow(cur);applyPrefs();render()};$('#mt').onclick=()=>{LS.set('match',LS.get('match','1')==='1'?'0':'1');if(cur)el.volume=matchGain(cur,curV);render()};$$('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;LS.set(k,b.dataset.v);if(k==='accent')LS.set('follow','0');applyPrefs();render()})}
function renderTabs(){const T=[['lib','Library',ICON.lib],['ar','A&amp;R',ICON.ar],['set','Settings',ICON.set]];$('#tabs').innerHTML=T.map(([k,l,i])=>`<button data-t="${k}" ${tab===k?'aria-current="page"':''}>${i}${l}</button>`).join('');$$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function render(){({lib:viewLib,ar:viewAr,set:viewSet}[tab])();renderTabs();$('#view').scrollTop=0}
async function seedExample(){try{const blob=exampleBlob(),m=measure(await decode(blob));songs=[{id:'example',title:'Example track',example:true,fav:false,lyrics:'[00:00] Example lyrics follow along here\n[00:07] Add your own in Song details',versions:[{id:'example-v1',name:'V1',blob,m,added:0}],cur:'example-v1',cover:8}]}catch{}}
(async()=>{applyPrefs();render();const stored=(await dbAll()).map(upgrade);for(const s of stored)if(!s.versions.length)continue;songs=stored.filter(s=>s.versions.length).sort((a,b)=>b.added-a.added);if(stored.some(s=>s)&&stored.length)for(const s of stored)dbPut(s);if(!songs.length)await seedExample();if(songs[0])glow(songs[0]);render()})();
